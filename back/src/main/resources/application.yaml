spring:
  application:
    name: back
  # DB 접속 정보
  datasource:
    url: jdbc:mysql://localhost:3306/final_sample?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: server
    password: server
    driver-class-name: com.mysql.cj.jdbc.Driver
  # 챗봇 (Spring AI + OpenAI)
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:no-key}   # 환경변수에서 읽는다. 없으면 no-key (챗봇만 꺼진다). 키 값을 여기에 쓰지 않는다
      timeout: 30s                        # 30초 안에 답이 없으면 포기
      max-retries: 1                      # 실패 시 다시 시도는 1번만
      chat:
        model: gpt-5.6-luna               # 쓸 수 있는 모델: gpt-5.6-luna · gpt-5.6-sol · gpt-5.6-terra
    retry:
      max-attempts: 1                     # Spring AI 쪽 재시도도 끈다 (기본 10번, 최대 3분 대기)
  # 파일 업로드 크기 제한
  servlet:
    multipart:
      max-file-size: 10MB      # 파일 하나
      max-request-size: 50MB   # 요청 하나 전체 (파일 여러 개 + 글 내용)

# 서버 포트 (React 의 vite.config.js API_TARGET 과 같아야 한다)
server:
  port: 8080

mybatis:
  # Mapper XML 위치
  mapper-locations: classpath:mappers/**/*.xml
  # XML 에서 패키지 없이 클래스명만 쓸 수 있게 해 주는 기준 패키지
  type-aliases-package: com.kh.back.**.dto
  configuration:
    # 컬럼명이 sector_name 처럼 snake_case 여도 자바 필드 sectorName 에 자동 매핑
    map-underscore-to-camel-case: true

# 로그인 토큰 설정
jwt:
  # 토큰 서명 키. 32바이트(영문 32자) 미만이면 서버가 시작되지 않는다.
  # 키 길이에 따라 서명 방식이 자동으로 정해진다 (32~47바이트 HS256, 48~63바이트 HS384, 64바이트 이상 HS512)
  secret: final-project-sample-secret-key-please-change-0123456789
  # access token 유효 시간 (30m = 30분, 10s = 10초)
  access-token-validity: 30m
  # refresh token 유효 시간 (14d = 14일)
  refresh-token-validity: 14d
  # refresh token 쿠키의 Secure 속성. https 에서만 쿠키를 보낸다. 로컬 http 개발에서는 false
  cookie-secure: false

# 업로드한 파일을 저장할 폴더.
# 상대 경로는 "서버를 실행한 위치" 기준이다 (IntelliJ 실행 → back 폴더, java -jar → 명령을 실행한 폴더)
file:
  upload-dir: ./uploads

# 예측 서버(FastAPI) 주소와 시간 제한
ml:
  base-url: http://localhost:8000
  connect-timeout: 2s   # 연결이 안 되면 2초 뒤 포기 → 503
  read-timeout: 5s      # 응답이 5초 안에 안 오면 포기 → 503

# 검색 서버(Elasticsearch) 주소와 시간 제한 — ml: 설정과 같은 모양
search:
  es:
    base-url: http://localhost:9200
    news-index: news        # 인덱스 이름이 아니라 별칭. 인덱스를 바꿔도 여기는 그대로
    connect-timeout: 2s
    read-timeout: 3s

# 실행되는 SQL 을 콘솔에서 보기 위한 로그 레벨
logging:
  level:
    com.kh.back: debug